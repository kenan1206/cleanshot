<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    min-height: 852px;
  }

  .phone {
    width: 100%;
    min-height: 852px;
    background: linear-gradient(160deg, #6494ff 0%, #5383ff 45%, #4070f0 100%);
    position: relative;
    overflow: hidden;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  /* BG decorations */
  .bg1 {
    position: absolute; top: -100px; right: -60px;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.13) 0%, transparent 65%);
  }
  .bg2 {
    position: absolute; bottom: -80px; left: -40px;
    width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20,10,100,0.3) 0%, transparent 65%);
  }

  .inner {
    position: relative; z-index: 1;
    padding: 44px 18px 32px;
  }

  /* ── Header ── */
  .eyebrow {
    text-align: center;
    font-size: 12px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: #FFD166;
    margin-bottom: 4px;
  }
  .title {
    text-align: center;
    font-size: 52px; font-weight: 800;
    color: #fff; letter-spacing: -2px; line-height: 1;
    margin-bottom: 24px;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 14px;
  }

  /* Left col starts at row 1, right col offset down */
  .col-left  { display: flex; flex-direction: column; gap: 14px; }
  .col-right { display: flex; flex-direction: column; gap: 14px; margin-top: 36px; }

  /* Photo Card */
  .card {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.35),
      0 6px 18px rgba(0,0,0,0.2);
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
  }

  .card img {
    width: 100%; height: 180px;
    object-fit: cover; display: block;
  }

  /* App badge on photo */
  .app-badge {
    position: absolute;
    bottom: 10px; left: 10px;
    display: flex; align-items: center; gap: 7px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 100px;
    padding: 5px 12px 5px 6px;
  }

  .app-icon {
    width: 26px; height: 26px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; line-height: 1;
    flex-shrink: 0;
  }

  .app-name {
    font-size: 13px; font-weight: 700;
    color: #fff; letter-spacing: 0.1px;
  }

  /* Subtle overlay gradient on photo */
  .card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.45));
    pointer-events: none;
  }
  .app-badge { z-index: 2; }
</style>
</head>
<body>
<div class="phone">
  <div class="bg1"></div>
  <div class="bg2"></div>

  <div class="inner">
    <div class="eyebrow">Lösche</div>
    <div class="title">Chat-Fotos</div>

    <div style="display:flex; gap:14px;">

      <!-- Left column -->
      <div class="col-left" style="flex:1;">

        <div class="card">
          <img src="https://images.unsplash.com/photo-1772724317388-4d1d1cc45c09?crop=entropy&cs=srgb&fm=jpg&w=400&q=88" />
          <div class="app-badge">
            <div class="app-icon" style="background:#FFFC00;">

            </div>

        </div>

      </div>

      <div class="col-right" style="flex:1;">

        <div class="card">
          <img src="https://images.unsplash.com/photo-1520880867055-1e30d1cb001c?crop=entropy&cs=srgb&fm=jpg&w=400&q=88" />
          <div class="app-badge">
            <div class="app-icon" style="background:#7360F2;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
            <span class="app-name">Viber</span>

        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1758613170846-e468188aee84?crop=entropy&cs=srgb&fm=jpg&w=400&q=88" />

            </div>
            <span class="app-name">Signal</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
