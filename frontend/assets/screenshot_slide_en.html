<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100%;
    height: 852px;
    background: #5383ff;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .glow-top {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .glow-bottom {
    position: absolute;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(30,30,120,0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 32px 48px;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 100px;
    padding: 6px 16px;
    margin-bottom: 30px;
  }
  .badge-dot {
    width: 7px;
    height: 7px;
    background: #ffffff;
    border-radius: 50%;
  }
  .badge-text {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.95);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .headline {
    font-size: 52px;
    font-weight: 800;
    color: #ffffff;
    text-align: center;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 8px;
  }
  .subheadline {
    font-size: 17px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    text-align: center;
    margin-bottom: 40px;
  }

  .icon-wrap {
    width: 96px;
    height: 96px;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    font-size: 44px;
  }

  .features {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .feature-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    padding: 15px 18px;
  }

  .feature-icon {
    width: 38px;
    height: 38px;
    background: rgba(255,255,255,0.2);
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }

  .feature-text {
    font-size: 15.5px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.2px;
    flex: 1;
  }

  .feature-check {
    width: 22px;
    height: 22px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="container">

    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">✦ CleanU</span>
    </div>

    <div class="headline">Free your<br>Device.</div>
    <div class="subheadline">Cleaning made easy</div>

    <div class="icon-wrap">✦</div>

    <div class="features">
      <div class="feature-row">
        <div class="feature-icon">📸</div>
        <span class="feature-text">Foto-Duplicates & ähnliche Bilder</span>
        <div class="feature-check">✓</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">🎬</div>
        <span class="feature-text">Space-Eating Videos</span>
        <div class="feature-check">✓</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">📱</div>
        <span class="feature-text">Old Screenshots</span>
        <div class="feature-check">✓</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">👥</div>
        <span class="feature-text">Duplicate Contacts</span>
        <div class="feature-check">✓</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">⚡</div>
        <span class="feature-text">Done in 60 Seconds</span>
        <div class="feature-check">✓</div>
      </div>
    </div>

  </div>
</body>
</html>
