<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 100%; height: 100vh;
    background: #5383ff;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }
  .container {
    width: 100%; height: 100vh;
    background: linear-gradient(160deg, #6494ff 0%, #5383ff 45%, #4070f0 100%);
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between;
    padding: 80px 80px 80px;
    position: relative; overflow: hidden;
  }
  .glow-top {
    position: absolute; top: -160px; left: 50%; transform: translateX(-50%);
    width: 800px; height: 800px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-bottom {
    position: absolute; bottom: -120px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20,10,100,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  /* Top section */
  .top { display: flex; flex-direction: column; align-items: center; z-index:1; }
  .badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.28);
    border-radius: 100px; padding: 8px 24px; margin-bottom: 40px;
  }
  .badge-dot { width: 9px; height: 9px; background: #fff; border-radius: 50%; }
  .badge-text { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.95); letter-spacing: 1px; text-transform: uppercase; }
  .headline { font-size: 88px; font-weight: 800; color: #fff; text-align: center; line-height: 1.0; letter-spacing: -3px; margin-bottom: 20px; }
  .subheadline { font-size: 26px; font-weight: 400; color: rgba(255,255,255,0.7); text-align: center; }
  /* Icon */
  .icon-wrap {
    width: 160px; height: 160px;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.25);
    border-radius: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 72px; box-shadow: 0 12px 48px rgba(0,0,0,0.12);
    z-index:1;
  }
  /* Features */
  .features { width: 100%; display: flex; flex-direction: column; gap: 16px; z-index:1; }
  .feature-row {
    display: flex; align-items: center; gap: 24px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px; padding: 22px 28px;
  }
  .feature-icon {
    width: 60px; height: 60px; background: rgba(255,255,255,0.2);
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .feature-text { font-size: 22px; font-weight: 600; color: #fff; letter-spacing: -0.3px; flex:1; }
  .feature-check {
    width: 32px; height: 32px; background: rgba(255,255,255,0.25); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff;
  }
</style>
</head>
<body>
<div class="container">
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="top">
    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">✦ CleanU</span>
    </div>
    <div class="headline">Cihazını<br>özgür bırak.</div>
    <div class="subheadline">Temizlik artık kolay</div>
  </div>

  <div class="icon-wrap">✦</div>

  <div class="features">
    <div class="feature-row">
      <div class="feature-icon">📸</div>
      <span class="feature-text">Foto Kopyaları & Benzer Görüntüler</span>
      <div class="feature-check">✓</div>
    </div>
    <div class="feature-row">
      <div class="feature-icon">🎬</div>
      <span class="feature-text">Yer Kaplayan Videolar</span>
      <div class="feature-check">✓</div>
    </div>
    <div class="feature-row">
      <div class="feature-icon">📱</div>
      <span class="feature-text">Eski Ekran Görüntüleri</span>
      <div class="feature-check">✓</div>
    </div>
    <div class="feature-row">
      <div class="feature-icon">👥</div>
      <span class="feature-text">Kopyalanan Kişiler</span>
      <div class="feature-check">✓</div>
    </div>
    <div class="feature-row">
      <div class="feature-icon">⚡</div>
      <span class="feature-text">60 Saniyede Biter</span>
      <div class="feature-check">✓</div>
    </div>
  </div>
</div>
</body>
</html>
