<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    min-height: 852px;
  }

  .phone {
    width: 100%;
    min-height: 852px;
    background: linear-gradient(160deg, #6494ff 0%, #5383ff 40%, #4070f0 100%);
    position: relative;
    overflow: hidden;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  /* Background decoration */
  .bg-circle-1 {
    position: absolute; top: -120px; right: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 65%);
    border-radius: 50%;
  }
  .bg-circle-2 {
    position: absolute; bottom: -60px; left: -60px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(30,20,120,0.35) 0%, transparent 65%);
    border-radius: 50%;
  }

  .inner {
    position: relative; z-index: 1;
    padding: 52px 20px 44px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ── TOP LABEL ── */
  .top-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 100px;
    padding: 5px 14px 5px 10px;
    margin-bottom: 32px;
    backdrop-filter: blur(12px);
  }
  .top-badge-dot {
    width: 8px; height: 8px;
    background: #FFD166;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,209,102,0.8);
  }
  .top-badge-text {
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: #FFD166;
  }

  /* ── SECTION ── */
  .section { width: 100%; margin-bottom: 28px; }

  .section-eyebrow {
    font-size: 11px; font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    text-align: center; margin-bottom: 4px;
  }

  .section-title {
    font-size: 46px; font-weight: 800;
    color: #fff; letter-spacing: -2px; line-height: 1;
    text-align: center; margin-bottom: 20px;
  }

  /* ── PHOTO PAIR ── */
  .pair {
    display: flex; gap: 12px;
    padding: 0 4px;
  }

  .slot { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0; }

  /* Card wraps photo + badge */
  .card {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 26px;
    padding: 6px;
    backdrop-filter: blur(4px);
    box-shadow:
      0 24px 60px rgba(0,0,0,0.4),
      0 8px 24px rgba(0,0,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .photo {
    width: 100%; aspect-ratio: 3/4;
    border-radius: 20px; overflow: hidden;
    position: relative;
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  /* keep = subtle green tint overlay */
  .photo.keep-tint::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(52,199,89,0.25));
    border-radius: 20px;
  }
  /* delete = red tint + slight desaturate */
  .photo.del-tint img { filter: saturate(0.7) brightness(0.88); }
  .photo.del-tint::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(255,59,48,0.3));
    border-radius: 20px;
  }

  /* Action row */
  .action-row {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 10px;
  }

  .badge {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    border: 2px solid rgba(255,255,255,0.3);
  }
  .badge.keep { background: #34C759; }
  .badge.del  { background: #FF3B30; }

  .action-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .action-label.keep { color: #34C759; }
  .action-label.del  { color: #FF3B30; }

  /* ── DIVIDER ── */
  .divider {
    width: 90%; height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
    margin: 4px 0 26px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>

  <div class="inner">

    <!-- Top badge -->
    <div class="top-badge">
      <div class="top-badge-dot"></div>
      <span class="top-badge-text">✦ CleanU erkennt</span>
    </div>

    <!-- DUPLIKATE -->
    <div class="section">
      <div class="section-eyebrow">Automatisch</div>
      <div class="section-title">Duplikate</div>
      <div class="pair">
        <div class="slot">
          <div class="card">
            <div class="photo keep-tint">
              <img src="https://images.unsplash.com/photo-1653762381632-2945469edb7b?crop=entropy&cs=srgb&fm=jpg&w=420&q=88" />
            </div>
          </div>
          <div class="action-row">
            <div class="badge keep">✓</div>
            <span class="action-label keep">Behalten</span>
          </div>
        </div>
        <div class="slot">
          <div class="card">
            <div class="photo del-tint">
              <img src="https://images.unsplash.com/photo-1653762381632-2945469edb7b?crop=entropy&cs=srgb&fm=jpg&w=420&q=88&crop=top" style="object-position: center 15%;" />
            </div>
          </div>
          <div class="action-row">
            <div class="badge del">✕</div>
            <span class="action-label del">Löschen</span>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ÄHNLICHE FOTOS -->
    <div class="section">
      <div class="section-eyebrow">Und findet</div>
      <div class="section-title">Ähnliche Fotos</div>
      <div class="pair">
        <div class="slot">
          <div class="card">
            <div class="photo keep-tint">
              <img src="https://images.unsplash.com/photo-1464852045489-bccb7d17fe39?crop=entropy&cs=srgb&fm=jpg&w=420&q=88" />
            </div>
          </div>
          <div class="action-row">
            <div class="badge keep">✓</div>
            <span class="action-label keep">Behalten</span>
          </div>
        </div>
        <div class="slot">
          <div class="card">
            <div class="photo del-tint">
              <img src="https://images.unsplash.com/photo-1559310589-2673bfe16970?crop=entropy&cs=srgb&fm=jpg&w=420&q=88" />
            </div>
          </div>
          <div class="action-row">
            <div class="badge del">✕</div>
            <span class="action-label del">Löschen</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
